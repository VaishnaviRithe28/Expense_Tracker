<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses</title>
    <link rel="stylesheet" href="last.css">
</head>
<body>
    <nav class="nav">
        <a class="nav-link active" aria-current="page" href="front.html">Home</a>
        <a class="nav-link" href="last.html">My Expense</a>
        <a class="nav-link" href="feedback.html">Feedback</a>
      </nav>
    <button type="button" class="b1" onclick="location.href='group.html'">Create Group Expense</button>
    <button type="button" class="b1" onclick="location.href='my.html'">Create My Expense</button>
    <button type="button" class="b1" onclick="location.href='aggre.html'">Aggregate Functions</button>
    <div class="expense">
      <h2>
        Expense List
      </h2>
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Purpose</th>
            <th>Who Paid</th>
            <th>Participants</th>
            <th>Date</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="expense-body"></tbody>
        <tfoot>
        <tr>
            <td colspan="5"><b>Total Personal Expense</b></td>
            <td id="total"></td>
        </tr>

        <tr>
            <td colspan="5"><b>For You (Group Share)</b></td>
            <td id="for-you"></td>
        </tr>
</tfoot>
      </table>
    </div>
    <script src="last.js"></script>
</body>
</html>
